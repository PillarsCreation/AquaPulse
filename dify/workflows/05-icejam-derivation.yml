app:
  description: 凌汛推演引擎：冰情输入→热力评估→冰塞壅水→漫滩淹没→风险评估→分级预警→转移任务→反馈校正。面向秋冬春三季开江期，LLM 仅负责文案转译，数值结论全部由 Code 节点确定性产出。
  icon: 🧊
  icon_background: '#E0F7FA'
  mode: workflow
  name: icejam-derivation
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        file_size_limit: 15
        workflow_file_upload_limit: 3
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
          - local_file
        detail: high
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
      - data:
          isInIteration: false
          sourceType: start
          targetType: code
        id: n1-n2
        source: n1
        sourceHandle: source
        target: n2
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: code
        id: n2-n3
        source: n2
        sourceHandle: source
        target: n3
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: code
        id: n3-n4
        source: n3
        sourceHandle: source
        target: n4
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: code
        id: n4-n5
        source: n4
        sourceHandle: source
        target: n5
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: code
        id: n5-n6
        source: n5
        sourceHandle: source
        target: n6
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: code
        id: n6-n7
        source: n6
        sourceHandle: source
        target: n7
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: llm
          targetType: code
        id: n7-n8
        source: n7
        sourceHandle: source
        target: n8
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          sourceType: code
          targetType: end
        id: n8-n9
        source: n8
        sourceHandle: source
        target: n9
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      # ---------- ① 开始·冰情输入 ----------
      - data:
          desc: 凌汛推演 ①。卫星遥感 + 冰厚遥测站 + 水文站融合
          selected: false
          title: 开始·冰情输入
          type: start
          variables:
            - label: 冰厚 m
              max_length: 48
              options: []
              required: true
              type: number
              variable: ice_thickness
            - label: 流凌密度 %
              max_length: 48
              options: []
              required: true
              type: number
              variable: flow_density
            - label: 气温 ℃
              max_length: 48
              options: []
              required: true
              type: number
              variable: temp
            - label: 水位超警 m
              max_length: 48
              options: []
              required: true
              type: number
              variable: water_rise
            - label: 受影响人口
              max_length: 48
              options: []
              required: true
              type: number
              variable: population
            - label: 河段风险描述
              max_length: 128
              options: []
              required: false
              type: paragraph
              variable: terrain_risk
            - label: 村组名称
              max_length: 48
              options: []
              required: true
              type: text-input
              variable: village_name
        height: 200
        id: n1
        position:
          x: 40
          y: 240
        positionAbsolute:
          x: 40
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ---------- ② 冰情结构化 ----------
      - data:
          code: |
            def main(ice_thickness, flow_density, temp, water_rise):
                return {
                    'ice_thickness': round(ice_thickness, 2),
                    'flow_density': round(flow_density, 1),
                    'temp': round(temp, 1),
                    'water_rise': round(water_rise, 2),
                    'data_source': '卫星遥感+冰厚遥测站+水文站融合',
                }
          code_language: python3
          desc: 凌汛推演 ②。四要素冰情结构化，附数据来源
          outputs:
            ice_thickness:
              children: null
              type: number
            flow_density:
              children: null
              type: number
            temp:
              children: null
              type: number
            water_rise:
              children: null
              type: number
            data_source:
              children: null
              type: string
          selected: false
          title: 冰情结构化
          type: code
          variables:
            - value_selector:
                - n1
                - ice_thickness
              variable: ice_thickness
            - value_selector:
                - n1
                - flow_density
              variable: flow_density
            - value_selector:
                - n1
                - temp
              variable: temp
            - value_selector:
                - n1
                - water_rise
              variable: water_rise
        height: 54
        id: n2
        position:
          x: 250
          y: 240
        positionAbsolute:
          x: 250
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ---------- ③ 热力评估 ----------
      - data:
          code: |
            def main(temp):
                # 气温回升系数：决定融冰速度与武开河风险
                warm_factor = 1 if temp >= 0 else (0.75 if temp >= -5 else 0.5)
                break_up_hours = max(6, round(48 * warm_factor))
                wu_risk = '高' if temp >= -5 else '中'
                return {
                    'warm_factor': warm_factor,
                    'break_up_hours': break_up_hours,
                    'wu_risk': wu_risk,
                }
          code_language: python3
          desc: 凌汛推演 ③。气温回升系数 → 武开河风险 → 开江倒计时
          outputs:
            warm_factor:
              children: null
              type: number
            break_up_hours:
              children: null
              type: number
            wu_risk:
              children: null
              type: string
          selected: false
          title: 热力评估
          type: code
          variables:
            - value_selector:
                - n1
                - temp
              variable: temp
        height: 54
        id: n3
        position:
          x: 460
          y: 240
        positionAbsolute:
          x: 460
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ---------- ④ 冰塞壅水 ----------
      - data:
          code: |
            def main(flow_density, ice_thickness, water_rise):
                # 弯道卡塞风险 = 流凌密度×0.6 + 冰厚×80 + 水位超警×30
                jam_risk = min(100, round(flow_density * 0.6 + ice_thickness * 80 + water_rise * 30))
                return {
                    'jam_risk': jam_risk,
                    'rise_rate': 0.12,
                }
          code_language: python3
          desc: 凌汛推演 ④。冰凌卡塞形成冰坝，评估壅水风险与涨率
          outputs:
            jam_risk:
              children: null
              type: number
            rise_rate:
              children: null
              type: number
          selected: false
          title: 冰塞壅水评估
          type: code
          variables:
            - value_selector:
                - n1
                - flow_density
              variable: flow_density
            - value_selector:
                - n1
                - ice_thickness
              variable: ice_thickness
            - value_selector:
                - n1
                - water_rise
              variable: water_rise
        height: 54
        id: n4
        position:
          x: 670
          y: 240
        positionAbsolute:
          x: 670
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ---------- ⑤ 漫滩淹没 ----------
      - data:
          code: |
            def main(ice_thickness, water_rise):
                max_depth = min(6, round((ice_thickness * 1.8 + water_rise * 1.5) * 10) / 10)
                area = round((2.5 + water_rise * 3 + ice_thickness * 2) * 10) / 10
                if max_depth > 3:
                    dist = '深度淹没区（>2m）占40%，中深度（1-2m）占35%，浅淹没（<1m）占25%'
                elif max_depth > 1.5:
                    dist = '深度淹没区（>2m）占20%，中深度（1-2m）占45%，浅淹没（<1m）占35%'
                else:
                    dist = '浅淹没区（<1m）占65%，中深度（1-2m）占35%'
                return {
                    'area': area,
                    'max_depth': max_depth,
                    'depth_distribution': dist,
                }
          code_language: python3
          desc: 凌汛推演 ⑤。冰坝壅水漫滩淹没面积与水深分布
          outputs:
            area:
              children: null
              type: number
            max_depth:
              children: null
              type: number
            depth_distribution:
              children: null
              type: string
          selected: false
          title: 漫滩淹没分析
          type: code
          variables:
            - value_selector:
                - n1
                - ice_thickness
              variable: ice_thickness
            - value_selector:
                - n1
                - water_rise
              variable: water_rise
        height: 54
        id: n5
        position:
          x: 880
          y: 240
        positionAbsolute:
          x: 880
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ---------- ⑥ 风险评估 ----------
      - data:
          code: |
            def main(jam_risk, warm_factor, area, population):
                hazard = min(100, round(jam_risk * 0.7 + warm_factor * 30))
                exposure = min(100, round(min(population * 0.3, 60) + area * 8))
                vulnerability = 70  # 北方沿河村落房屋抗涝能力普遍偏低
                risk_score = round(hazard * 0.4 + exposure * 0.35 + vulnerability * 0.25)
                if risk_score >= 75:
                    level, level_cn = 'red', '红色'
                elif risk_score >= 55:
                    level, level_cn = 'orange', '橙色'
                elif risk_score >= 35:
                    level, level_cn = 'yellow', '黄色'
                else:
                    level, level_cn = 'blue', '蓝色'
                return {
                    'hazard': hazard,
                    'exposure': exposure,
                    'vulnerability': vulnerability,
                    'risk_score': risk_score,
                    'level': level,
                    'level_cn': level_cn,
                }
          code_language: python3
          desc: 凌汛推演 ⑥。危险性×0.4 + 暴露度×0.35 + 脆弱性×0.25，国标四级预警
          outputs:
            hazard:
              children: null
              type: number
            exposure:
              children: null
              type: number
            vulnerability:
              children: null
              type: number
            risk_score:
              children: null
              type: number
            level:
              children: null
              type: string
            level_cn:
              children: null
              type: string
          selected: false
          title: 风险评估分级
          type: code
          variables:
            - value_selector:
                - n4
                - jam_risk
              variable: jam_risk
            - value_selector:
                - n3
                - warm_factor
              variable: warm_factor
            - value_selector:
                - n5
                - area
              variable: area
            - value_selector:
                - n1
                - population
              variable: population
        height: 54
        id: n6
        position:
          x: 1090
          y: 240
        positionAbsolute:
          x: 1090
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ---------- ⑦ LLM 双文案生成 ----------
      - data:
          context:
            enabled: false
            variable_selector: []
          desc: 凌汛推演 ⑦。将结构化冰情推演结果转译为村民通俗版与专业溯源版双文案
          model:
            completion_params:
              temperature: 0.2
              max_tokens: 1200
            mode: chat
            name: qwen-max
            provider: tongyi
          prompt_template:
            - id: sys-prompt
              role: system
              text: |
                你是一名防凌预警发布专家，服务于北方沿河各县防汛抗旱指挥部。
                你的任务是把结构化的冰情推演结果，转译为两份文案。

                【铁律】
                1. 只使用下方给出的推演数据，严禁编造任何数值。
                2. 村民版必须让 60 岁以上老人一听就懂，不出现壅水、流凌密度等专业术语。
                3. 村民版必须包含：风险等级、开江预计时间、最大漫滩水深、转移路线、安置点，以及"严禁在冰面上行走、玩耍或围观"。
                4. 专业版必须完整列出凌汛八步推演参数，供上级核查。
                5. 若检索到防凌应急预案片段，指令必须与预案原文一致，不得自行发挥。

                【输出格式】
                ===村民通俗版===
                （80 字以内，口语化，含具体撤离路线与安置点）

                ===专业溯源版===
                （分条列出：一、冰情输入 二、热力评估 三、冰塞壅水 四、漫滩淹没 五、风险评估 六、模型版本）
            - id: usr-prompt
              role: user
              text: |
                【村组】{{#n1.village_name#}}
                【风险等级】{{#n6.level_cn#}}预警（{{#n6.level#}}，综合风险分 {{#n6.risk_score#}）
                【冰情】冰厚 {{#n2.ice_thickness#}}m，流凌密度 {{#n2.flow_density#}}%，气温 {{#n2.temp#}}℃，水位超警 {{#n2.water_rise#}}m（数据源：{{#n2.data_source#}}）
                【热力评估】气温回升系数 {{#n3.warm_factor#}}，武开河风险 {{#n3.wu_risk#}}，预计 {{#n3.break_up_hours#}} 小时内开江
                【冰塞壅水】弯道卡塞风险分 {{#n4.jam_risk#}}，壅水涨率约 {{#n4.rise_rate#}}m/h
                【漫滩淹没】面积 {{#n5.area#}}km²，最大水深 {{#n5.max_depth#}}m，{{#n5.depth_distribution#}}
                【风险评估】危险性{{#n6.hazard#}} 暴露度{{#n6.exposure#}} 脆弱性{{#n6.vulnerability#}}
                【受影响人口】{{#n1.population#}} 人
          selected: false
          title: LLM 双文案生成
          type: llm
          variables: []
          vision:
            enabled: false
        height: 98
        id: n7
        position:
          x: 1300
          y: 300
        positionAbsolute:
          x: 1300
          y: 300
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ---------- ⑧ 转移任务生成 ----------
      - data:
          code: |
            def main(level, population, village_name):
                if level == 'red':
                    count = population
                elif level == 'orange':
                    count = round(population * 0.7)
                elif level == 'yellow':
                    count = round(population * 0.3)
                else:
                    count = 0
                return {
                    'person_count': count,
                    'shelter': f'{village_name}安置点',
                    'responsible': f'{village_name}村支书兼防凌责任人',
                    'routes': [
                        '迅速撤离至河道堤防高程以上预设安置点（海拔+20m以上）',
                        '远离弯道卡塞段与历史决口段，严禁在冰面上行走或围观',
                    ],
                }
          code_language: python3
          desc: 凌汛推演 ⑧。自动生成转移人数、安置点、责任人与撤离路线
          outputs:
            person_count:
              children: null
              type: number
            shelter:
              children: null
              type: string
            responsible:
              children: null
              type: string
            routes:
              children: null
              type: array[string]
          selected: false
          title: 转移任务生成
          type: code
          variables:
            - value_selector:
                - n6
                - level
              variable: level
            - value_selector:
                - n1
                - population
              variable: population
            - value_selector:
                - n1
                - village_name
              variable: village_name
        height: 54
        id: n8
        position:
          x: 1510
          y: 240
        positionAbsolute:
          x: 1510
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244

      # ---------- ⑨ 结束·反馈校正 ----------
      - data:
          desc: 凌汛推演 ⑨。输出完整推演结果，附模型版本与精度说明
          outputs:
            - value_selector:
                - n6
                - level
              variable: level
            - value_selector:
                - n6
                - risk_score
              variable: risk_score
            - value_selector:
                - n7
                - text
              variable: warning_text
            - value_selector:
                - n8
                - person_count
              variable: person_count
            - value_selector:
                - n8
                - shelter
              variable: shelter
            - value_selector:
                - n8
                - routes
              variable: routes
            - value_selector:
                - n3
                - break_up_hours
              variable: break_up_hours
          selected: false
          title: 结束·反馈校正
          type: end
        height: 90
        id: n9
        position:
          x: 1720
          y: 240
        positionAbsolute:
          x: 1720
          y: 240
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.55
  rag_pipeline:
    enabled: false
